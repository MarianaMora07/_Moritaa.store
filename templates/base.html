<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>_moritaa.store | Arreglos Eternos</title>
    <!-- Tailwind CSS (Cambiado a CDN estándar para producción) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX para interactividad fluida -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Lucide Icons para los iconos de redes sociales -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        html, body { height: 100%; margin: 0; box-sizing: border-box; }
        body { font-family: 'Nunito', sans-serif; }
        .font-display { font-family: 'Playfair Display', serif; }

        /* Animaciones estéticas del diseño de Canvas */
        @keyframes floatUp { 0% { opacity: 0; transform: translateY(40px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes fadeScale { 0% { opacity: 0; transform: scale(0.85); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes shimmer { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }
        @keyframes orbit { 0% { transform: rotate(0deg) translateX(120px) rotate(0deg); } 100% { transform: rotate(360deg) translateX(120px) rotate(-360deg); } }
        @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 20px rgba(168,85,247,0.4); } 50% { box-shadow: 0 0 40px rgba(168,85,247,0.7); } }
        @keyframes sparkle { 0%, 100% { opacity: 0; transform: scale(0); } 50% { opacity: 1; transform: scale(1); } }

        .anim-float { animation: floatUp 0.8s ease-out both; }
        .anim-float-d1 { animation: floatUp 0.8s 0.15s ease-out both; }
        .anim-float-d2 { animation: floatUp 0.8s 0.3s ease-out both; }
        .anim-float-d3 { animation: floatUp 0.8s 0.45s ease-out both; }
        .anim-scale { animation: fadeScale 1s 0.2s ease-out both; }

        .shimmer-text {
            background: linear-gradient(90deg, #e9d5ff, #fff, #c084fc, #e9d5ff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 4s linear infinite;
        }

        .card-hover { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .card-hover:hover { transform: translateY(-12px) scale(1.03); }
        .sparkle-dot { position: absolute; width: 6px; height: 6px; background: #e9d5ff; border-radius: 50%; animation: sparkle 2.5s ease-in-out infinite; }
        
        .cta-btn { animation: pulse-glow 2.5s ease-in-out infinite; transition: all 0.3s ease; }
        .cta-btn:hover { transform: scale(1.08); animation: none; box-shadow: 0 0 50px rgba(168,85,247,0.8); }

        .orbit-flower { animation: orbit 18s linear infinite; }
        .orbit-flower2 { animation: orbit 24s linear infinite reverse; }

        .bg-mesh {
            background:
                radial-gradient(ellipse at 20% 0%, rgba(126,34,206,0.35) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(192,132,252,0.2) 0%, transparent 40%),
                radial-gradient(ellipse at 50% 80%, rgba(88,28,135,0.3) 0%, transparent 50%),
                linear-gradient(170deg, #1a0533 0%, #0f0219 40%, #1a0533 100%);
        }

        .glass-card { background: rgba(88,28,135,0.2); backdrop-filter: blur(12px); border: 1px solid rgba(192,132,252,0.2); }
        .gallery-item { transition: all 0.5s ease; }
        .gallery-item:hover { transform: scale(1.06); z-index: 10; }
    </style>
</head>
<body class="h-full bg-mesh text-purple-100 overflow-auto">

    <!-- Destellos decorativos fijos -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden" aria-hidden="true">
        <div class="sparkle-dot" style="top:10%;left:15%;animation-delay:0s"></div>
        <div class="sparkle-dot" style="top:25%;left:75%;animation-delay:0.8s"></div>
        <div class="sparkle-dot" style="top:60%;left:10%;animation-delay:1.6s"></div>
        <div class="sparkle-dot" style="top:45%;left:85%;animation-delay:0.4s"></div>
        <div class="sparkle-dot" style="top:80%;left:50%;animation-delay:1.2s"></div>
    </div>

    <!-- Navegación -->
    <header class="relative z-20">
        <nav class="flex items-center justify-between px-6 md:px-12 py-5">
            <div class="flex items-center gap-3 anim-float">
                <div class="w-10 h-10 rounded-full bg-gradient-to-br from-purple-400 to-fuchsia-500 flex items-center justify-center text-white font-bold text-lg">✿</div>
                <span class="font-display text-xl font-bold text-purple-200">_moritaa.store</span>
            </div>
            <div class="hidden md:flex gap-8 text-sm font-semibold anim-float-d1">
                <a href="#servicios" class="hover:text-purple-300 transition">Servicios</a>
                <a href="#asistente" class="hover:text-purple-300 transition">Asistente IA</a>
                <a href="#galeria" class="hover:text-purple-300 transition">Galería</a>
                <a href="#contacto" class="hover:text-purple-300 transition">Contacto</a>
            </div>
            <button id="mobile-menu-btn" class="md:hidden text-purple-300" aria-label="Menú">
                <i data-lucide="menu" style="width:28px;height:28px"></i>
            </button>
        </nav>
        <div id="mobile-menu" class="hidden md:hidden glass-card mx-4 rounded-2xl p-6 flex flex-col gap-4 text-center font-semibold">
            <a href="#servicios" class="hover:text-purple-300 transition py-2">Servicios</a>
            <a href="#asistente" class="hover:text-purple-300 transition py-2">Asistente IA</a>
            <a href="#galeria" class="hover:text-purple-300 transition py-2">Galería</a>
            <a href="#contacto" class="hover:text-purple-300 transition py-2">Contacto</a>
        </div>
    </header>

    <!-- Aquí se inyectará el contenido dinámico de cada página -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="text-center py-10 px-6 border-t border-purple-800/30 mt-20">
        <div class="flex justify-center gap-6 mb-4">
            <a href="#" class="text-purple-400 hover:text-purple-200 transition"><i data-lucide="instagram" style="width:22px;height:22px"></i></a>
            <a href="#" class="text-purple-400 hover:text-purple-200 transition"><i data-lucide="phone" style="width:22px;height:22px"></i></a>
        </div>
        <p class="text-purple-500 text-sm">Hecho con amor para cada momento especial 💜</p>
        <p class="text-purple-700 text-xs mt-2">© 2026 _moritaa.store. Todos los derechos reservados.</p>
    </footer>

    <script>
        // Inicializar los iconos de Lucide
        lucide.createIcons();

        // Menú móvil funcional
        document.getElementById('mobile-menu-btn').addEventListener('click', () => {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        });

        // Scroll suave
        document.querySelectorAll('a[href^="#"]').forEach(a => {
            a.addEventListener('click', (e) => {
                e.preventDefault();
                const target = document.querySelector(a.getAttribute('href'));
                if (target) target.scrollIntoView({ behavior: 'smooth' });
            });
        });
    </script>
</body>
</html>
